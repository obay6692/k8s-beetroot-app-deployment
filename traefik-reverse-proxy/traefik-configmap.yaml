apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: staging
data:
  traefik.yml: |
    ## Static configuration
    entryPoints:
      web:
        address: ":80"
    providers:
      file:
        filename: "/etc/traefik/config.yml"
  config.yml: |
    ## Dynamic configuration
    http:
      routers:
        beetroot-router:
          rule: "PathPrefix(`/`)"
          service: beetroot-service
          entryPoints:
          - web
      services:
        beetroot-service:
          loadBalancer:
            servers:
              - url: "http://beetroot-service:8080"
